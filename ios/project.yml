name: SuishouCun
options:
  bundleIdPrefix: com.suishou.cun
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: NO
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  SuishouCun:
    type: application
    platform: iOS
    sources:
      - path: SuishouCunApp.swift
      - path: NotesModel.swift
      - path: ContentView.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.suishou.cun.ios
        PRODUCT_NAME: SuishouCun
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: 随手存
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        MARKETING_VERSION: '2.0.0'
        CURRENT_PROJECT_VERSION: '1'
  SuishouCunTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: SuishouCun
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  SuishouCun:
    build:
      targets:
        SuishouCun: all
    test:
      targets:
        - SuishouCunTests
